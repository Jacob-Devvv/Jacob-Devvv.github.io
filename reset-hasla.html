<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zresetuj hasło - Jacob Dev</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #131b2e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            background: #0b0f19;
            border: 1px solid #2a3b5c;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #2563eb; }
        #info { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Ustaw nowe hasło</h2>
        <form id="resetForm">
            <input type="password" id="newPassword" placeholder="Wpisz nowe hasło" required>
            <button type="submit">Zapisz nowe hasło</button>
        </form>
        <p id="info"></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const info = document.getElementById('info');

            if (!token) {
                info.style.color = '#ef4444';
                info.innerText = 'Brak tokenu resetowania w adresie URL.';
                return;
            }

            try {
                const response = await fetch('https://jacob-dev-api.kubad5122.workers.dev/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    info.style.color = '#22c55e';
                    info.innerText = data.message;
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    info.style.color = '#ef4444';
                    info.innerText = data.error || 'Wystąpił błąd.';
                }
            } catch (err) {
                info.style.color = '#ef4444';
                info.innerText = 'Błąd połączenia z serwerem.';
            }
        });
    </script>
</body>
</html>
